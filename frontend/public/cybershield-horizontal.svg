<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%" fill="none" role="img" aria-label="CyberShield AI Logo">
  <defs>
    <linearGradient id="hzShieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1628"/>
      <stop offset="100%" stop-color="#07111F"/>
    </linearGradient>
    <linearGradient id="hzShieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="hzCyanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="hzGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Group (Scaled & Translated) -->
  <g transform="translate(10, 8) scale(0.68)">
    <!-- Outer Shield Geometry -->
    <path d="M50 8 L85 22 V50 C85 71 69 87 50 93 C31 87 15 71 15 50 V22 Z"
          fill="url(#hzShieldBg)"
          stroke="url(#hzShieldBorder)"
          stroke-width="3"
          stroke-linejoin="round"/>

    <!-- Inner Shield Inset -->
    <path d="M50 14 L79 26 V49 C79 67 66 81 50 86 C34 81 21 67 21 49 V26 Z"
          fill="none"
          stroke="#23364F"
          stroke-width="1.5"/>

    <!-- Neural Circuits -->
    <line x1="50" y1="23" x2="50" y2="40" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="2 2"/>
    <line x1="32" y1="36" x2="45" y2="48" stroke="#22D3EE" stroke-width="1.5" opacity="0.85"/>
    <line x1="68" y1="36" x2="55" y2="48" stroke="#22D3EE" stroke-width="1.5" opacity="0.85"/>
    <line x1="33" y1="62" x2="44" y2="58" stroke="#3B82F6" stroke-width="1.5" opacity="0.85"/>
    <line x1="67" y1="62" x2="56" y2="58" stroke="#3B82F6" stroke-width="1.5" opacity="0.85"/>

    <!-- Nodes -->
    <circle cx="50" cy="23" r="3" fill="#22D3EE" filter="url(#hzGlow)"/>
    <circle cx="32" cy="36" r="2.5" fill="#3B82F6"/>
    <circle cx="68" cy="36" r="2.5" fill="#3B82F6"/>
    <circle cx="33" cy="62" r="2.5" fill="#22D3EE"/>
    <circle cx="67" cy="62" r="2.5" fill="#22D3EE"/>

    <!-- Core Hexagon -->
    <polygon points="50,42 60,48 60,60 50,66 40,60 40,48"
             fill="#0B1628"
             stroke="#22D3EE"
             stroke-width="2"
             filter="url(#hzGlow)"/>

    <!-- Protected Core Checkmark -->
    <path d="M45 54 L48.5 57.5 L55.5 49.5"
          fill="none"
          stroke="#F8FAFC"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>

  <!-- Typography: CyberShield AI -->
  <text x="86" y="44" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="700" font-size="24" fill="#F8FAFC" letter-spacing="-0.5">
    Cyber<tspan fill="#22D3EE">Shield</tspan>
  </text>
  <!-- AI Badge -->
  <rect x="238" y="27" width="34" height="20" rx="5" fill="#14243A" stroke="#22D3EE" stroke-width="1.2"/>
  <text x="255" y="41" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#22D3EE" text-anchor="middle" letter-spacing="0.5">
    AI
  </text>
  <!-- Tagline underneath -->
  <text x="87" y="60" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="10" fill="#94A3B8" letter-spacing="0.8">
    INTELLIGENT THREAT DETECTION
  </text>
</svg>
